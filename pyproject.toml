[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-eng-workbench"
version = "1.0.0"
description = "Flagship local-first AI Engineering platform (RAG, agents, evals, ML, MLOps)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Nishant Tyagi", email = "tnishant838@gmail.com" }]
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.27.0",
  "pydantic>=2.6.0",
  "pydantic-settings>=2.2.0",
  "sqlalchemy>=2.0.25",
  "numpy>=1.26.0",
  "pandas>=2.1.0",
  "scikit-learn>=1.4.0",
  "joblib>=1.3.0",
  "httpx>=0.27.0",
  "streamlit>=1.31.0",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dense = ["sentence-transformers>=2.5.0"]
faiss = ["faiss-cpu>=1.7.4"]
chroma = ["chromadb>=0.4.22"]
mlflow = ["mlflow>=2.10.0"]
otel = ["opentelemetry-api>=1.22.0", "opentelemetry-sdk>=1.22.0"]
scheduler = ["APScheduler>=3.10.0"]
dev = ["ruff>=0.3.0", "bandit>=1.7.0"]
all = [
  "ai-eng-workbench[dense,faiss,chroma,mlflow,otel,scheduler,dev]",
]

[tool.setuptools.packages.find]
include = ["app*", "ui*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
